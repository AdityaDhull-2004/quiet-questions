<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Quiet Questions</title>
<meta name="description" content="Five everyday dilemmas, a follow-up for each, and a research-based reading of what your answers say about you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: one reading column like a clinician's case file; each dilemma is a numbered plate with its own generated inkblot. */
:root {
  --paper: #F3F4F6;
  --sunk: #E7E9ED;
  --card: #FFFFFF;
  --ink: #15171C;
  --ink-2: #4B5060;
  --rule: #D2D5DC;
  --red: #B3261E;
  --red-wash: #F6E3E1;
  --f-display: "Gloock", "Bodoni Moda", "Didot", Georgia, serif;
  --f-body: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --s-0: 1.0625rem;
  --s-1: 1.3rem;
  --s-2: 1.65rem;
  --s-3: clamp(1.9rem, 4.6vw, 2.5rem);
  --s-4: clamp(2.3rem, 6.4vw, 3.5rem);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101115; --sunk: #191B21; --card: #1C1E25; --ink: #ECEAE5; --ink-2: #A7ABB6;
    --rule: #2E313A; --red: #EE5A50; --red-wash: #35191A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101115; --sunk: #191B21; --card: #1C1E25; --ink: #ECEAE5; --ink-2: #A7ABB6;
  --rule: #2E313A; --red: #EE5A50; --red-wash: #35191A; color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--s-0);
  line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 44rem; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: var(--s-4); letter-spacing: -0.01em; }
h2 { font-size: var(--s-3); }
h3 { font-size: var(--s-1); }
p { margin: 0; }
a { color: inherit; text-decoration-color: var(--red); text-underline-offset: 3px; }
button { font: inherit; }

/* header */
header.top {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem 1rem;
  padding-block: 1.1rem; border-bottom: 1px solid var(--rule);
}
.wordmark { font-family: var(--f-display); font-size: 1.2rem; }
.wordmark i { font-style: normal; color: var(--red); }
.progress { display: flex; gap: 0.4rem; align-items: center; }
.progress .dot {
  width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 1px solid var(--rule);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.66rem; color: var(--ink-2);
}
.progress .dot.now { border-color: var(--ink); color: var(--ink); }
.progress .dot.done { background: var(--ink); border-color: var(--ink); color: var(--paper); }

main { padding-block: 2.25rem 3.5rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); }
.label { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
.stack { display: grid; gap: 1rem; }

/* inkblot plate */
.blot {
  display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 840 / 510;
  animation: unfold 1100ms cubic-bezier(.2, .7, .2, 1) both;
}
@keyframes unfold {
  from { clip-path: inset(0 50% 0 50%); opacity: 0.3; }
  to { clip-path: inset(0 0 0 0); opacity: 1; }
}
.reveal { animation: rise 420ms ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* intro */
.intro { display: grid; gap: 1.25rem; }
.intro .blot { width: min(100%, 30rem); margin-inline: auto; }
.lede { font-size: 1.18rem; color: var(--ink-2); max-width: 36rem; }
.plate-list { list-style: none; margin: 0.5rem 0 0; padding: 0; border-top: 1px solid var(--rule); }
.plate-list li {
  display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.25rem 1rem; padding-block: 0.7rem;
  border-bottom: 1px solid var(--rule);
}
.plate-list .num { font-family: var(--f-mono); font-size: 0.78rem; color: var(--red); padding-top: 0.2rem; }
.plate-list .t { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.25; }
.plate-list .th { grid-column: 2; color: var(--ink-2); font-size: 0.95rem; }
.start { display: grid; gap: 0.6rem; margin-top: 0.75rem; padding: 1.25rem; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
.start-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.start input {
  flex: 1 1 14rem; min-width: 0; padding: 0.75rem 0.9rem; font: inherit; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
}
.start input:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
.hint { font-size: 0.92rem; color: var(--ink-2); }
.err { font-size: 0.92rem; color: var(--red); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.2rem; border-radius: 4px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer;
  font-family: var(--f-mono); font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase;
}
.btn:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--sunk); color: var(--ink); border-color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* plate */
.plate { display: grid; gap: 1.1rem; }
.plate h2:focus { outline: none; }
.scenario { font-size: 1.16rem; }
.prompt { font-family: var(--f-display); font-size: var(--s-1); }
.options { display: grid; gap: 0.55rem; }
.opt {
  display: grid; grid-template-columns: 1.6rem 1fr; gap: 0.7rem; align-items: baseline; width: 100%;
  padding: 0.85rem 1rem; text-align: left; color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 6px; cursor: pointer;
  transition: border-color .15s, background-color .15s, opacity .25s;
}
.opt .k { font-family: var(--f-mono); font-size: 0.8rem; color: var(--ink-2); }
.opt:hover { border-color: var(--ink); }
.opt:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
.options.locked .opt { cursor: default; }
.options.locked .opt:hover { border-color: var(--rule); }
.opt.picked, .options.locked .opt.picked:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.opt.picked .k { color: var(--paper); }
.opt.faded { opacity: 0.42; }

.note { display: grid; gap: 0.55rem; padding: 1.3rem 1.3rem 1.15rem; background: var(--sunk); border-radius: 6px; }
.note h3 { font-size: var(--s-2); }
.note .daily { color: var(--ink-2); font-size: 0.98rem; }
.note .daily .label { margin-right: 0.5rem; }
.follow { display: grid; gap: 1rem; margin-top: 1.25rem; padding-top: 1.6rem; border-top: 1px dashed var(--rule); }
.after { display: grid; gap: 0.9rem; margin-top: 1.25rem; }
.reads { padding: 1rem 1.2rem; border: 1px solid var(--rule); border-radius: 6px; display: grid; gap: 0.3rem; }

details.fold { border-top: 1px solid var(--rule); padding-top: 0.8rem; }
details.fold > summary {
  cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1rem; align-items: baseline;
  font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 1rem; color: var(--red); }
details.fold[open] > summary::after { content: "\2212"; }
details.fold > summary:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.fold-body { display: grid; gap: 1.1rem; padding-block: 1rem 0.4rem; }
.other { display: grid; gap: 0.35rem; }
.other .q { font-style: italic; color: var(--ink-2); }
.other h4 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 1.15rem; }
.other .case { font-size: 0.98rem; }
.other .case b { font-weight: 500; color: var(--red); }
.refs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; }
.refs li { display: grid; gap: 0.2rem; }
.refs .cite { font-size: 0.9rem; color: var(--ink-2); }
.next-row { display: flex; justify-content: flex-end; padding-top: 0.5rem; }

/* results */
.result { display: grid; gap: 2.25rem; }
.r-hero { display: grid; gap: 0.75rem; }
.r-hero .tag { font-size: 1.2rem; color: var(--ink-2); max-width: 36rem; }
.section { display: grid; gap: 0.9rem; }
.section > h2 { font-size: var(--s-2); }
.traits { display: grid; gap: 1.05rem; }
.trait { display: grid; grid-template-columns: 11rem 1fr 2.6rem; gap: 0.35rem 0.9rem; align-items: center; }
.t-name { font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.04em; }
.t-bar { height: 0.6rem; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.t-bar span { display: block; height: 100%; background: var(--ink); border-radius: 99px; transform-origin: left; animation: grow 900ms cubic-bezier(.2, .7, .2, 1) both; }
.trait.top .t-bar span { background: var(--red); }
.trait.top .t-name { color: var(--red); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.t-val { font-family: var(--f-mono); font-size: 0.85rem; text-align: right; font-variant-numeric: tabular-nums; }
.t-desc { grid-column: 1 / -1; color: var(--ink-2); font-size: 0.92rem; }
.prose { display: grid; gap: 0.8rem; }
.prose p { max-width: 38rem; }
.facets { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 0.75rem; }
.facet { display: grid; gap: 0.35rem; align-content: start; padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.patterns { display: grid; gap: 1.25rem; }
.pattern { display: grid; gap: 0.35rem; padding-left: 1rem; border-left: 2px solid var(--red); }
.pattern h3 { font-size: 1.25rem; }
.meter { display: flex; gap: 0.35rem; }
.meter span { width: 1.6rem; height: 0.6rem; border-radius: 2px; background: var(--sunk); border: 1px solid var(--rule); }
.meter span.on { background: var(--ink); border-color: var(--ink); }
.blind { padding: 1.2rem 1.3rem; background: var(--red-wash); border-radius: 6px; display: grid; gap: 0.5rem; }
.recap { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.recap li { display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.2rem 1rem; padding-block: 0.85rem; border-bottom: 1px solid var(--rule); }
.recap .num { font-family: var(--f-mono); font-size: 0.78rem; color: var(--red); padding-top: 0.25rem; }
.recap .body { display: grid; gap: 0.25rem; min-width: 0; }
.recap .t { font-family: var(--f-display); font-size: 1.1rem; }
.recap .ans { font-size: 0.96rem; }
.recap .ans span { color: var(--ink-2); }
.actions { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.status { font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink-2); }
.linkbox { width: 100%; padding: 0.6rem 0.7rem; font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; }

.foot { border-top: 1px solid var(--rule); padding-block: 1.25rem 2rem; color: var(--ink-2); font-size: 0.9rem; display: grid; gap: 0.4rem; }

@media (max-width: 560px) {
  .trait { grid-template-columns: 1fr 2.6rem; }
  .t-bar { grid-column: 1 / -1; grid-row: 2; }
  .plate-list li, .recap li { grid-template-columns: 1fr; }
  .plate-list .th { grid-column: 1; }
}
@media (prefers-reduced-motion: reduce) {
  .blot, .reveal, .t-bar span { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="wordmark">The Quiet <i>Questions</i></span>
    <nav class="progress" id="progress" aria-label="Progress" hidden></nav>
  </header>
  <main id="app">
    <noscript><p>This page needs JavaScript to run the questions.</p></noscript>
  </main>
  <footer class="foot">
    <p>Built on published research in moral psychology and behavioural economics. Sources are listed under every plate.</p>
    <p>A reflective exercise, not a clinical or validated psychological test. Five answers cannot capture a whole person.</p>
  </footer>
</div>
<script>
(() => {
"use strict";

// Paste your Google Apps Script web-app URL here to record every finished run in your Google Sheet (see README).
const RESPONSE_ENDPOINT = "";

/* ---------- traits ---------- */
const TRAITS = [
  { k: "C", name: "Compassion", desc: "How strongly other people's feelings and suffering steer your choices." },
  { k: "A", name: "Respect for autonomy", desc: "How far you let other adults run their own lives, even badly." },
  { k: "I", name: "Principle", desc: "How much fixed rules of honesty and fairness govern you, watched or not." },
  { k: "L", name: "Loyalty", desc: "How much duties to your own people outweigh duties to strangers and rules." },
  { k: "T", name: "Appetite for truth", desc: "How willing you are to seek, face and deliver uncomfortable facts." },
  { k: "P", name: "Self-protection", desc: "How carefully you guard your own resources, comfort and peace of mind." }
];
const TRAIT = Object.fromEntries(TRAITS.map(t => [t.k, t]));
const ORDER = "CAILTP";

/* ---------- the five plates ----------
   score: points added to each trait. held: true if the follow-up answer kept the first stance,
   false if it moved, null where the follow-up does not test a stance. */
const PLATES = [
{
  numeral: "I", seed: 1931, reds: 0,
  title: "The Beggar and the Bottle",
  theme: "Generosity and control",
  scenario: "A man outside a shop asks you for some money. His breath smells of alcohol, and you are fairly sure that whatever you give will go on another bottle, not a meal. You have spare change, and giving it would cost you nothing that matters.",
  prompt: "What do you do?",
  measures: "Whether your generosity is about the person, the outcome, or your own comfort, and how much control you attach to the help you give.",
  options: [
    { key: "A", text: "Give him the money. What he does with it is his business.", score: { A: 2, C: 1 },
      title: "Help without strings",
      body: "You separate the act of helping from the right to decide how help is used. To you, a gift with conditions attached is only half a gift. People who answer this way tend to see adults as the authors of their own lives, including the bad chapters, and they are uncomfortable playing judge over a stranger's choices. There is humility in it too: you do not assume you know better than he does what gets him through the night.",
      daily: "You are probably the friend who gives advice only when asked and lets people make their own mistakes.",
      case: "Respect for autonomy. A gift with conditions is control, and an adult gets to decide how to survive.",
      follow: { prompt: "He thanks you, then asks for one more thing. The shop won't serve him. Would you go in and buy the bottle for him with that same money?",
        options: [
          { key: "A1", text: "Yes. Same money, same choice, his decision.", score: { A: 2, I: 1 }, held: true,
            title: "Consistent all the way down",
            body: "You applied your principle even when it became uncomfortable. Many people who hand over cash freely refuse at this point, which shows their comfort depended on distance from the outcome. Yours does not. You treat his autonomy as real rather than as a convenient reason to skip the hard question. The risk on this side is that addiction itself erodes free choice, so respecting the choice can end up meaning respecting the addiction." },
          { key: "A2", text: "No. Giving cash is fine, but buying the bottle myself feels wrong.", score: { C: 1, P: 1 }, held: false,
            title: "Comfortable at a distance",
            body: "This is the most human answer on the page. The outcome is identical, yet doing it with your own hands feels different. Moral psychologists describe an action principle and a contact principle: we judge harm we cause directly more harshly than harm we merely enable, even when the result is the same. Your generosity is real, and part of what it protects is the feeling of being a good person. Cash leaves the moral responsibility with him. The bottle would put it in your hands." }
        ] } },
    { key: "B", text: "Buy him food instead. I'll help, but not with alcohol.", score: { C: 2, A: -1 },
      title: "Care with a steering wheel",
      body: "You want to help, and you want your help to do good by your own standards. Economists call this paternalistic altruism: caring about someone's wellbeing as you define it rather than as they would. It is very common. In one experiment, donors gave about 40% more when they could give a smoker nicotine patches instead of cash, and when they could choose, over 90% of donations were given in kind. Your instinct protects him from harm and protects you from feeling complicit.",
      daily: "You probably show love through practical help, and it stings when people don't use your help the way you meant it.",
      case: "Responsible care. I want to help the person, not the addiction.",
      follow: { prompt: "You hand him a sandwich. He says politely, \"Thanks, but I'm not hungry. I really just need the money.\" How do you feel?",
        options: [
          { key: "B1", text: "Fair enough. I'd give him a little cash too.", score: { A: 2, C: 1 }, held: false,
            title: "You listen and adjust",
            body: "You started with your own idea of what help looks like, then changed course when he spoke for himself. That is a valuable trait: help that responds to the person in front of you instead of your picture of them. People like this often make good carers, teachers and managers because they can drop a plan once it stops fitting the person." },
          { key: "B2", text: "A bit irritated. I offered help and he turned it down.", score: { A: -1, P: 1 }, held: true,
            title: "Help on your terms",
            body: "The irritation is worth noticing. It suggests the help was partly an expression of your own values, so a refusal felt like a refusal of you. Help that looks unconditional often carries an unspoken expectation of gratitude or compliance. In close relationships this can show up as feeling unappreciated when someone ignores your advice. The care is genuine. The strings are invisible, even to you." },
          { key: "B3", text: "Calm. Food is what I'm willing to give, and that's that.", score: { I: 1, P: 1 }, held: true,
            title: "Firm boundaries, no resentment",
            body: "You set a limit and keep it without anger. You are not trying to control him and you are not offended by his choice. You simply decide what you will take part in. This is the healthiest form of paternalistic giving: clear about your own line and relaxed about other people's." }
        ] } },
    { key: "C", text: "Give nothing. I won't fund an addiction.", score: { P: 2, I: 1, C: -1 },
      title: "The gatekeeper",
      body: "You judge help by its consequences. If the likely result is harm, you would rather give nothing than feed the problem. Researchers who study the deservingness heuristic find that people decide whom to help with one fast question: is this need caused by bad luck or by the person's own choices? When a need looks self-inflicted, anger replaces compassion, and the switch happens quickly and mostly outside awareness. Your answer suggests you take responsibility seriously, both his and your own.",
      daily: "You likely hold people to clear standards and dislike being taken advantage of. Others may read you as fair, firm, and hard to win over.",
      case: "Responsible refusal. Money that feeds an addiction is not kindness.",
      follow: { prompt: "Same man. This time you somehow know for certain the money will buy food for his child. Do you give?",
        options: [
          { key: "C1", text: "Yes, then I'd give.", score: { C: 2, I: 1 }, held: false,
            title: "Conditional compassion",
            body: "Your generosity is there, but deservingness gates it. You help when the need looks innocent and hold back when it looks self-made. Studies in the US and Denmark found that support for helping depends mostly on whether a person seems lazy or unlucky, regardless of political views. The instinct keeps you from being exploited. Its cost is that addiction is rarely a simple choice, and the people who look least deserving are often the ones whose need is most severe." },
          { key: "C2", text: "Still no. I don't give money to people on the street.", score: { P: 2 }, held: true,
            title: "Policy over impulse",
            body: "You run your giving on a rule instead of on the story in front of you. That protects you from manipulation and from decision fatigue, and many people with this answer give through organised channels instead. The trade-off is that a rule can shield you from feeling anything at all. If you never give on the street, check that it is a considered policy and not a way of never having to look." }
        ] } },
    { key: "D", text: "Walk past without really deciding.", score: { P: 1, T: -1 },
      title: "The quiet swerve",
      body: "This is the most common answer that people rarely admit, and it is revealing: you avoided the choice instead of making it. In a field study outside a supermarket, when a charity collector stood at one door and said \"please give\", between 26% and 33% of shoppers avoided that door. The researchers concluded that people steer clear of situations that would make them feel empathy, because they know the empathy would cost them. Avoiding the ask protects your wallet and your self-image at the same time.",
      daily: "When a situation threatens an uncomfortable feeling, your first move may be to step around it rather than through it.",
      case: "Self-protection. I can't help everyone, and I don't have to make a decision every time.",
      follow: { prompt: "Be honest. When you walk past someone like this, what are you mostly avoiding?",
        options: [
          { key: "D1", text: "The awkwardness of the interaction.", score: { P: 1 }, held: null,
            title: "Social friction",
            body: "For you the hard part is the encounter, not the money. You may be generous in settings you control, such as donating online, while street requests feel intrusive and unscripted. People with this answer often dislike being put on the spot in general: sales pitches, public speaking, open confrontation." },
          { key: "D2", text: "The guilt of saying no to his face.", score: { C: 2, T: -1 }, held: null,
            title: "Too much empathy, not too little",
            body: "This answer usually belongs to people who feel a great deal. Psychologists describe empathy as partly motivated: we turn it up or down depending on what we expect it to cost us. You walk past because you know that if you stop, you will feel it, and the feeling is heavy. The avoidance is a way of regulating emotion, and it is not coldness." },
          { key: "D3", text: "Nothing. Honestly, I don't think about it.", score: { C: -1, P: 1 }, held: null,
            title: "Habituation",
            body: "When something is seen every day, the mind stops flagging it. This is ordinary habituation and it happens to most people who live in cities. It does not make you unkind. It does mean your moral attention is being spent elsewhere, and that some of your values run on autopilot until something breaks the routine." }
        ] } }
  ],
  research: [

/* ---------- inkblots ---------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hexToRgb(h) {
  h = h.trim().replace("#", "");
  if (h.length === 3) h = h.split("").map(c => c + c).join("");
  const n = parseInt(h, 16);
  return [n >> 16 & 255, n >> 8 & 255, n & 255];
}
const blots = [];
function drawBlot(cv, seed, reds) {
  const W = 840, H = 510, half = W / 2;
  cv.width = W; cv.height = H;
  const rnd = mulberry32(seed);
  const ink = [], red = [];
  const n = 12 + Math.floor(rnd() * 7);
  for (let i = 0; i < n; i++) {
    const x = half - Math.pow(rnd(), 1.4) * half * 0.78;
    const y = H * (0.14 + rnd() * 0.72);
    const r = W * (0.02 + rnd() * 0.05);
    ink.push([x, y, r * r]);
  }
  for (let i = 0; i < 24; i++) {
    const x = half - (0.12 + rnd() * 0.82) * half, y = H * (0.05 + rnd() * 0.9), r = W * (0.002 + rnd() * 0.007);
    ink.push([x, y, r * r]);
  }
  for (let i = 0; i < reds; i++) {
    const x = half - (0.25 + rnd() * 0.55) * half, y = H * (0.12 + rnd() * 0.76), r = W * (0.014 + rnd() * 0.024);
    red.push([x, y, r * r]);
  }
  const css = getComputedStyle(document.documentElement);
  const ci = hexToRgb(css.getPropertyValue("--ink")), cr = hexToRgb(css.getPropertyValue("--red"));
  const ctx = cv.getContext("2d");
  const img = ctx.createImageData(W, H), d = img.data;
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < half; x++) {
      const grain = 1 + ((((x * 73856093) ^ (y * 19349663)) >>> 0) % 997 / 997 - 0.5) * 0.14;
      let f = 0, g = 0;
      for (let i = 0; i < ink.length; i++) { const b = ink[i], dx = x - b[0], dy = y - b[1], q = b[2] / (dx * dx + dy * dy + 1); f += q * q; }
      for (let i = 0; i < red.length; i++) { const b = red[i], dx = x - b[0], dy = y - b[1], q = b[2] / (dx * dx + dy * dy + 1); g += q * q; }
      f *= grain; g *= grain;
      let c = null, a = 0;
      if (g > 1) { c = cr; a = Math.min(1, 0.72 + (g - 1) * 0.12); }
      else if (f > 1) { c = ci; a = Math.min(1, 0.74 + (f - 1) * 0.06); }
      if (!c) continue;
      const A = Math.round(a * 255);
      let p = (y * W + x) * 4;
      d[p] = c[0]; d[p + 1] = c[1]; d[p + 2] = c[2]; d[p + 3] = A;
      p = (y * W + (W - 1 - x)) * 4;
      d[p] = c[0]; d[p + 1] = c[1]; d[p + 2] = c[2]; d[p + 3] = A;
    }
  }
  ctx.putImageData(img, 0, 0);
}
function blot(seed, reds, label) {
  const cv = el("canvas", { class: "blot", role: "img", "aria-label": label || "A symmetrical inkblot" });
  blots.push({ cv, seed, reds });
  requestAnimationFrame(() => drawBlot(cv, seed, reds));
  return cv;
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  for (const b of blots) if (b.cv.isConnected) drawBlot(b.cv, b.seed, b.reds);
});

/* ---------- scoring ---------- */
function zero() { return Object.fromEntries(TRAITS.map(t => [t.k, 0])); }
function add(s, sc) { for (const k in sc) s[k] += sc[k]; }
function picks(a) {
  return PLATES.map((p, i) => {
    const o = p.options.find(o => o.key === a["q" + (i + 1)]);
    const f = o && o.follow.options.find(f => f.key === a["q" + (i + 1) + "f"]);
    return { p, o, f };
  });
}
const RANGE = (() => {
  const lo = zero(), hi = zero();
  PLATES.forEach(p => TRAITS.forEach(({ k }) => {
    let mn = Infinity, mx = -Infinity;
    p.options.forEach(o => o.follow.options.forEach(f => {
      const v = (o.score[k] || 0) + (f.score[k] || 0);
      mn = Math.min(mn, v); mx = Math.max(mx, v);
    }));
    lo[k] += mn; hi[k] += mx;
  }));
  return { lo, hi };
})();
function pairKey(x, y) { return [x, y].sort((m, n) => ORDER.indexOf(m) - ORDER.indexOf(n)).join(""); }

function profileOf(a) {
  const raw = zero();
  let held = 0, counted = 0;
  picks(a).forEach(({ o, f }) => {
    add(raw, o.score); add(raw, f.score);
    if (f.held !== null) { counted++; if (f.held) held++; }
  });
  const pct = {};
  TRAITS.forEach(({ k }) => {
    const span = RANGE.hi[k] - RANGE.lo[k];
    pct[k] = span ? Math.round((raw[k] - RANGE.lo[k]) / span * 100) : 50;
  });
  const order = TRAITS.map(t => t.k).sort((x, y) => (pct[y] - pct[x]) || (raw[y] - raw[x]) || (ORDER.indexOf(x) - ORDER.indexOf(y)));
  const top = order[0], second = order[1], low = order[order.length - 1];
  const patterns = PATTERNS.filter(r => r.when(a)).slice(0, 5);
  return { raw, pct, order, top, second, low, pair: PAIRS[pairKey(top, second)], patterns, held, counted };
}

function codeOf(a) { return PLATES.map((_, i) => a["q" + (i + 1) + "f"]).join("."); }
function answersFromCode(code) {
  const parts = String(code || "").split(".");
  if (parts.length !== PLATES.length) return null;
  const a = {};
  for (let i = 0; i < PLATES.length; i++) {
    const key = parts[i], main = key.charAt(0);
    const o = PLATES[i].options.find(o => o.key === main);
    if (!o || !o.follow.options.some(f => f.key === key)) return null;
    a["q" + (i + 1)] = main; a["q" + (i + 1) + "f"] = key;
  }
  return a;
}
function resultLink(a, name) {
  return location.href.split("#")[0] + "#r=" + codeOf(a) + "&n=" + encodeURIComponent(name);
}

  s.append(el("p", { class: "eyebrow" }, "Five plates · about six minutes"));
  s.append(el("h1", null, "Five questions you answer every day without noticing."));
  s.append(el("p", { class: "lede" }, "Each plate is a small everyday dilemma. Choose what you would actually do, then answer a follow-up that tests that choice. At the end you get a reading of how you balance kindness, honesty, loyalty, freedom and truth, with the research behind every remark."));
  const list = el("ol", { class: "plate-list", "aria-label": "The five plates" });
  PLATES.forEach(p => list.append(el("li", null, [
    el("span", { class: "num" }, "Plate " + p.numeral),
    el("span", { class: "t" }, p.title),
    el("span", { class: "th" }, p.theme)
  ])));
  s.append(list);

  const input = el("input", { id: "name", name: "name", type: "text", autocomplete: "given-name", maxlength: "60", placeholder: "Your name", "aria-describedby": "name-hint" });
  input.value = state.name;
  const err = el("p", { class: "err", id: "name-err", hidden: true }, "Add your name so your reading can be addressed to you.");
  const form = el("form", { class: "start", id: "start-form", novalidate: true }, [
    el("label", { class: "label", for: "name" }, "Who is answering?"),
    el("div", { class: "start-row" }, [input, el("button", { class: "btn", type: "submit" }, "Begin plate I")]),
    err,
    el("p", { class: "hint", id: "name-hint" }, RESPONSE_ENDPOINT
      ? "When you finish, your name and answers are sent to the person who shared this page with you."
      : "Your answers stay in this browser tab.")
  ]);
  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.trim().replace(/\s+/g, " ");
    if (!v) { err.hidden = false; input.focus(); return; }
    state = { name: v, answers: {}, saved: false };
    renderPlate(0);
  });
  s.append(form);
  m.append(s);
}

/* ---------- plate ---------- */
function noteCard(label, r) {
  const n = el("div", { class: "note reveal" }, [
    el("p", { class: "eyebrow" }, label),
    el("h3", null, r.title),
    el("p", null, r.body)
  ]);
  if (r.daily) n.append(el("p", { class: "daily" }, [el("span", { class: "label" }, "In daily life"), r.daily]));
  return n;
}
function optionList(options, onPick) {
  const box = el("div", { class: "options", role: "group" });
  options.forEach(o => {
    const b = el("button", { class: "opt", type: "button" }, [el("span", { class: "k" }, o.key), el("span", null, o.text)]);
    b.addEventListener("click", () => {
      if (box.classList.contains("locked")) return;
      box.classList.add("locked");
      [...box.children].forEach(c => {
        c.classList.add(c === b ? "picked" : "faded");
        c.setAttribute("aria-disabled", "true");
        if (c === b) c.setAttribute("aria-pressed", "true");
      });
      onPick(o);
    });
    box.append(b);
  });
  return box;
}

function renderPlate(i) {
  setProgress(i);
  const p = PLATES[i];
  const m = clear();
  const s = el("section", { class: "plate" });
  const h = el("h2", { tabindex: "-1" }, p.title);
  s.append(el("p", { class: "eyebrow" }, "Plate " + p.numeral + " of V · " + p.theme), h);
  s.append(blot(p.seed, p.reds));
  s.append(el("p", { class: "scenario" }, p.scenario));
  s.append(el("p", { class: "prompt" }, p.prompt));

  const slot = el("div", { class: "stack" });
  s.append(optionList(p.options, o => {
    state.answers["q" + (i + 1)] = o.key;
    const note = noteCard("Analyst's note", o);
    const follow = el("div", { class: "follow reveal" }, [
      el("p", { class: "eyebrow" }, "Follow-up"),
      el("p", { class: "prompt" }, o.follow.prompt)
    ]);
    const fslot = el("div", { class: "stack" });
    follow.append(optionList(o.follow.options, f => {
      state.answers["q" + (i + 1) + "f"] = f.key;
      fslot.append(noteCard("What the follow-up shows", f));
      const after = afterBlock(p, o, i);
      fslot.append(after);
      scrollTo(fslot.firstChild);
    }));
    follow.append(fslot);
    slot.append(note, follow);
    scrollTo(note);
  }));
  s.append(slot);
  m.append(s);
  window.scrollTo({ top: 0, behavior: "auto" });
  h.focus({ preventScroll: true });
}

function afterBlock(p, chosen, i) {
  const wrap = el("div", { class: "after reveal" });
  wrap.append(el("div", { class: "reads" }, [el("span", { class: "label" }, "What this plate reads"), el("p", null, p.measures)]));

  const others = el("details", { class: "fold" }, el("summary", null, "How the other answers read"));
  const ob = el("div", { class: "fold-body" });
  p.options.filter(o => o !== chosen).forEach(o => {
    const [, value, argument] = o.case.match(/^([^.]*)\.\s*(.*)$/);
    ob.append(el("div", { class: "other" }, [
      el("p", { class: "q" }, "“" + o.text + "”"),
      el("h4", null, o.title),
      el("p", { class: "case" }, [el("b", null, value + ". "), argument]),
      el("p", null, o.body)
    ]));
  });
  others.append(ob);

  const research = el("details", { class: "fold" }, el("summary", null, "The research behind this plate"));
  const list = el("ul", { class: "refs" });
  p.research.forEach(r => list.append(el("li", null, [
    el("p", null, r.claim),
    el("p", { class: "cite" }, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.cite))
  ])));
  research.append(el("div", { class: "fold-body" }, list));

  const last = i === PLATES.length - 1;
  const next = el("button", { class: "btn", type: "button" }, last ? "See my reading" : "Next: plate " + PLATES[i + 1].numeral);
  next.addEventListener("click", () => last ? finish() : renderPlate(i + 1));
  wrap.append(others, research, el("div", { class: "next-row" }, next));
  return wrap;
}

/* ---------- results ---------- */
function finish() {
  const a = state.answers;
  try { history.replaceState(null, "", "#r=" + codeOf(a) + "&n=" + encodeURIComponent(state.name)); } catch (e) { /* file:// or sandboxed */ }
  renderResults(a, state.name, false);
}

function renderResults(a, name, shared) {
  setProgress(PLATES.length);
  const pr = profileOf(a);
  const m = clear();
  const r = el("section", { class: "result" });

  r.append(el("div", { class: "r-hero" }, [
    el("p", { class: "eyebrow" }, (shared ? "Shared reading for " : "Reading for ") + name),
    el("h1", null, pr.pair.name),
    el("p", { class: "tag" }, pr.pair.tag)
  ]));

  const traits = el("div", { class: "traits" });
  pr.order.forEach(k => traits.append(el("div", { class: "trait" + (k === pr.top ? " top" : "") }, [
    el("span", { class: "t-name" }, TRAIT[k].name),
    el("span", { class: "t-bar", role: "img", "aria-label": TRAIT[k].name + " " + pr.pct[k] + " out of 100" }, el("span", { style: "width:" + Math.max(pr.pct[k], 2) + "%" })),
    el("span", { class: "t-val" }, String(pr.pct[k])),
    el("p", { class: "t-desc" }, TRAIT[k].desc)
  ])));
  r.append(el("div", { class: "section" }, [el("h2", null, "Your six signals"), el("p", { class: "hint" }, "Each score runs from 0 to 100 and shows where your answers fell between the lowest and highest possible result on that trait."), traits]));

  const top = PROFILES[pr.top], sec = PROFILES[pr.second];
  r.append(el("div", { class: "section" }, [
    el("h2", null, "The core of you"),
    el("div", { class: "prose" }, [
      el("p", null, top.core),
      el("p", null, "Your second strongest signal is " + TRAIT[pr.second].name.toLowerCase() + ". " + sec.mod)
    ]),
    el("div", { class: "facets" }, [
      el("div", { class: "facet" }, [el("span", { class: "label" }, "In relationships"), el("p", null, top.rel)]),
      el("div", { class: "facet" }, [el("span", { class: "label" }, "At work"), el("p", null, top.work)]),
      el("div", { class: "facet" }, [el("span", { class: "label" }, "Under pressure"), el("p", null, top.stress)])
    ])
  ]));

  const pats = pr.patterns.length ? pr.patterns : [{
    title: "Where your instincts collide",
    body: "Across the five plates, " + TRAIT[pr.top].name.toLowerCase() + " pulled hardest and " + TRAIT[pr.low].name.toLowerCase() + " pulled least. When the two conflict in real life, expect the first to decide for you, and keep that in mind when the stakes are high."
  }];
  r.append(el("div", { class: "section" }, [
    el("h2", null, "Patterns across your answers"),
    el("div", { class: "patterns" }, pats.map(p => el("div", { class: "pattern" }, [el("h3", null, p.title), el("p", null, p.body)])))
  ]));

  const ratio = pr.counted ? pr.held / pr.counted : 0.5;
  const flex = ratio >= 0.7
    ? ["Steady", "You held your first answer in most follow-ups, even when the facts or the stakes changed. You decide from stable commitments more than case by case. People find you predictable and principled. When genuinely new information arrives, though, holding firm can look like stubbornness."]
    : ratio <= 0.35
      ? ["Responsive", "Your answers moved when the facts moved. You weigh details and consequences instead of applying fixed rules. Research on moral flexibility shows most people's judgements shift with framing and with how vivid the harm is, and you sit at the responsive end. The upside is good judgement in messy situations. The downside is that others may find you hard to predict."]
      : ["Selective", "You held some positions and let others move. You seem to know which of your commitments are fixed and which depend on the details, which is close to what psychologists describe as mature moral reasoning."];
  const meter = el("div", { class: "meter", role: "img", "aria-label": pr.held + " of " + pr.counted + " positions held" });
  for (let k = 0; k < pr.counted; k++) meter.append(el("span", { class: k < pr.held ? "on" : "" }));
  r.append(el("div", { class: "section" }, [
    el("h2", null, "How you hold a position"),
    el("div", { class: "actions" }, [meter, el("span", { class: "status" }, pr.held + " of " + pr.counted + " held under pressure · " + flex[0])]),
    el("p", { class: "prose" }, flex[1])
  ]));

  r.append(el("div", { class: "blind" }, [
    el("p", { class: "eyebrow" }, "Your blind spot"),
    el("h3", null, TRAIT[pr.low].name),
    el("p", null, PROFILES[pr.low].low)
  ]));

  const recap = el("ol", { class: "recap" });
  picks(a).forEach(({ p, o, f }) => recap.append(el("li", null, [
    el("span", { class: "num" }, "Plate " + p.numeral),
    el("div", { class: "body" }, [
      el("span", { class: "t" }, p.title),
      el("p", { class: "ans" }, [o.text + " ", el("span", null, "(" + o.title + ")")]),
      el("p", { class: "ans" }, [el("span", null, "Then: "), f.text + " ", el("span", null, "(" + f.title + ")")])
    ])
  ])));
  r.append(el("div", { class: "section" }, [el("h2", null, "Your answers, one by one"), recap]));

  const refs = el("ul", { class: "refs" });
  FRAMEWORKS.forEach(x => refs.append(el("li", null, [el("p", null, x.use), el("p", { class: "cite" }, el("a", { href: x.url, target: "_blank", rel: "noopener" }, x.cite))])));
  r.append(el("details", { class: "fold" }, [el("summary", null, "Frameworks behind this reading"), el("div", { class: "fold-body" }, refs)]));

  const link = resultLink(a, name);
  const linkBox = el("input", { class: "linkbox", id: "result-link", type: "text", readonly: true, value: link, hidden: true, "aria-label": "Link to this reading" });
  const status = el("span", { class: "status", role: "status" });
  const copy = el("button", { class: "btn", type: "button" }, "Copy link to this reading");
  copy.addEventListener("click", () => {
    const done = () => { status.textContent = "Link copied."; };
    const fallback = () => { linkBox.hidden = false; linkBox.focus(); linkBox.select(); status.textContent = "Select and copy the link below."; };
    try { navigator.clipboard.writeText(link).then(done, fallback); } catch (e) { fallback(); }
  });
  const again = el("button", { class: "btn ghost", type: "button" }, shared ? "Take it yourself" : "Start over");
  again.addEventListener("click", () => {
    state = { name: shared ? "" : state.name, answers: {}, saved: false };
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* ignore */ }
    renderIntro();
    window.scrollTo({ top: 0 });
  });
  const saveLine = el("p", { class: "status", role: "status" });
  r.append(el("div", { class: "section" }, [el("div", { class: "actions" }, [copy, again, status]), linkBox, saveLine]));

  m.append(r);
  window.scrollTo({ top: 0, behavior: "auto" });

  if (!shared && RESPONSE_ENDPOINT && !state.saved) {
    saveLine.textContent = "Sending your answers…";
    saveResponse(a, name, pr).then(ok => {
      saveLine.textContent = ok ? "Your answers were sent to the person who shared this page." : "Your answers could not be sent. Check your connection and use Copy link to share this reading instead.";
    });
  }
}

function saveResponse(a, name, pr) {
  state.saved = true;
  const columns = ["Name", "Profile", "Strongest traits"];
  const values = [name, pr.pair.name, TRAIT[pr.top].name + " + " + TRAIT[pr.second].name];
  picks(a).forEach(({ p, o, f }) => {
    columns.push("Plate " + p.numeral + " answer", "Plate " + p.numeral + " follow-up");
    values.push(o.key + ": " + o.text, f.key + ": " + f.text);
  });
  TRAITS.forEach(t => { columns.push(t.name); values.push(pr.pct[t.k]); });
  columns.push("Patterns", "Positions held", "Answer code", "Reading link");
  values.push(pr.patterns.map(x => x.title).join("; "), pr.held + " of " + pr.counted, codeOf(a), resultLink(a, name));
  return fetch(RESPONSE_ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ columns, values })
  }).then(() => true, () => false);
}

/* ---------- routing ---------- */
function route() {
  const params = new URLSearchParams(location.hash.slice(1));
  const a = answersFromCode(params.get("r"));
  if (a) {
    const name = (params.get("n") || "someone").slice(0, 60);
    const own = state.saved && codeOf(state.answers) === codeOf(a);
    renderResults(a, name, !own);
    return;
  }
  renderIntro();
}
window.addEventListener("hashchange", () => {
  const params = new URLSearchParams(location.hash.slice(1));
  if (answersFromCode(params.get("r"))) route();
});
route();
})();
</script>
</body>
</html>
