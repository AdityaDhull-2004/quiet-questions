<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Quiet Questions</title>
<meta name="description" content="Five everyday dilemmas as a short session: what you'd do, why, and a twist, followed by a research-based reading of what your answers say about you.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: one reading column like a clinician's case file; each dilemma is a plate with its own inkblot, then a session thread between the analyst and the person answering. */
:root {
  --paper: #F3F4F6;
  --sunk: #E7E9ED;
  --card: #FFFFFF;
  --ink: #15171C;
  --ink-2: #4B5060;
  --rule: #D2D5DC;
  --red: #B3261E;
  --red-wash: #F6E3E1;
  --f-display: "Gloock", "Bodoni Moda", "Didot", Georgia, serif;
  --f-body: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --s-0: 1.0625rem;
  --s-1: 1.3rem;
  --s-2: 1.65rem;
  --s-3: clamp(1.9rem, 4.6vw, 2.5rem);
  --s-4: clamp(2.3rem, 6.4vw, 3.5rem);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #101115; --sunk: #191B21; --card: #1C1E25; --ink: #ECEAE5; --ink-2: #A7ABB6;
    --rule: #2E313A; --red: #EE5A50; --red-wash: #35191A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #101115; --sunk: #191B21; --card: #1C1E25; --ink: #ECEAE5; --ink-2: #A7ABB6;
  --rule: #2E313A; --red: #EE5A50; --red-wash: #35191A; color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--s-0);
  line-height: 1.62;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 44rem; margin: 0 auto; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: var(--s-4); letter-spacing: -0.01em; }
h2 { font-size: var(--s-3); }
h3 { font-size: var(--s-1); }
p { margin: 0; }
a { color: inherit; text-decoration-color: var(--red); text-underline-offset: 3px; }
button { font: inherit; }

/* header */
header.top {
  display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 0.75rem 1rem;
  padding-block: 1.1rem; border-bottom: 1px solid var(--rule);
}
.wordmark { font-family: var(--f-display); font-size: 1.2rem; }
.wordmark i { font-style: normal; color: var(--red); }
.progress { display: flex; gap: 0.35rem; align-items: center; }
.progress .dot {
  width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 1px solid var(--rule);
  display: grid; place-items: center; font-family: var(--f-mono); font-size: 0.64rem; color: var(--ink-2);
}
.progress .dot.now { border-color: var(--ink); color: var(--ink); }
.progress .dot.done { background: var(--ink); border-color: var(--ink); color: var(--paper); }

main { padding-block: 2.25rem 3.5rem; }
.eyebrow { font-family: var(--f-mono); font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); }
.label { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }

/* inkblot plate */
.blot {
  display: block; width: 100%; max-width: 100%; height: auto; aspect-ratio: 840 / 510;
  animation: unfold 1100ms cubic-bezier(.2, .7, .2, 1) both;
}
@keyframes unfold {
  from { clip-path: inset(0 50% 0 50%); opacity: 0.3; }
  to { clip-path: inset(0 0 0 0); opacity: 1; }
}
.reveal { animation: rise 380ms ease-out both; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* intro */
.intro { display: grid; gap: 1.25rem; }
.intro .blot { width: min(100%, 30rem); margin-inline: auto; }
.lede { font-size: 1.18rem; color: var(--ink-2); max-width: 36rem; }
.steps { display: grid; grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr)); gap: 0.6rem; }
.step { display: grid; gap: 0.2rem; padding: 0.8rem 0.95rem; border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.step b { font-family: var(--f-display); font-weight: 400; font-size: 1.1rem; }
.step span { font-size: 0.92rem; color: var(--ink-2); }
.plate-list { list-style: none; margin: 0.5rem 0 0; padding: 0; border-top: 1px solid var(--rule); }
.plate-list li {
  display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.25rem 1rem; padding-block: 0.7rem;
  border-bottom: 1px solid var(--rule);
}
.plate-list .num { font-family: var(--f-mono); font-size: 0.78rem; color: var(--red); padding-top: 0.2rem; }
.plate-list .t { font-family: var(--f-display); font-size: 1.15rem; line-height: 1.25; }
.plate-list .th { grid-column: 2; color: var(--ink-2); font-size: 0.95rem; }
.start { display: grid; gap: 0.6rem; margin-top: 0.75rem; padding: 1.25rem; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; }
.start-row { display: flex; flex-wrap: wrap; gap: 0.6rem; }
.start input {
  flex: 1 1 14rem; min-width: 0; padding: 0.75rem 0.9rem; font: inherit; color: var(--ink);
  background: var(--paper); border: 1px solid var(--rule); border-radius: 4px;
}
.start input:focus-visible { outline: 2px solid var(--red); outline-offset: 1px; }
.hint { font-size: 0.92rem; color: var(--ink-2); }
.err { font-size: 0.92rem; color: var(--red); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.75rem 1.2rem; border-radius: 4px;
  border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer;
  font-family: var(--f-mono); font-size: 0.82rem; letter-spacing: 0.06em; text-transform: uppercase;
}
.btn:hover { background: var(--red); border-color: var(--red); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); }
.btn.ghost:hover { background: var(--sunk); color: var(--ink); border-color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* plate + session thread */
.plate { display: grid; gap: 1.1rem; }
.plate h2:focus { outline: none; }
.scenario { font-size: 1.16rem; }
.thread { display: grid; gap: 0.8rem; margin-top: 0.6rem; }
.msg { display: grid; gap: 0.45rem; max-width: 36rem; min-width: 0; padding: 0.95rem 1.15rem 1rem; background: var(--sunk); border-radius: 4px 16px 16px 16px; scroll-margin-top: 1.5rem; }
.msg .who { font-family: var(--f-mono); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--red); }
.msg .ask { font-family: var(--f-display); font-size: var(--s-1); line-height: 1.25; }
.msg.you { justify-self: end; max-width: 30rem; background: var(--ink); color: var(--paper); border-radius: 16px 4px 16px 16px; }
.msg.you .who { color: var(--paper); opacity: 0.7; }
.typing { display: flex; gap: 0.35rem; width: fit-content; padding: 0.95rem 1.1rem; }
.typing span { width: 0.42rem; height: 0.42rem; border-radius: 50%; background: var(--ink-2); animation: blink 1s infinite ease-in-out; }
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
.choices { display: grid; gap: 0.5rem; justify-self: end; width: min(100%, 32rem); }
.choice {
  display: grid; grid-template-columns: 1.4rem 1fr; gap: 0.6rem; align-items: baseline; width: 100%;
  padding: 0.75rem 1rem; text-align: left; color: var(--ink); background: var(--card);
  border: 1px solid var(--rule); border-radius: 16px 4px 16px 16px; cursor: pointer;
  transition: border-color .15s, background-color .15s;
}
.choice .k { font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink-2); }
.choice:hover { border-color: var(--ink); }
.choice:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.after { display: grid; gap: 0.9rem; margin-top: 1.25rem; padding-top: 1.25rem; border-top: 1px dashed var(--rule); }
details.fold { border-top: 1px solid var(--rule); padding-top: 0.8rem; }
details.fold > summary {
  cursor: pointer; list-style: none; display: flex; justify-content: space-between; gap: 1rem; align-items: baseline;
  font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink);
}
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::after { content: "+"; font-size: 1rem; color: var(--red); }
details.fold[open] > summary::after { content: "\2212"; }
details.fold > summary:focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
.fold-body { display: grid; gap: 1.1rem; padding-block: 1rem 0.4rem; }
.refs { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.9rem; }
.refs li { display: grid; gap: 0.2rem; }
.refs .cite { font-size: 0.9rem; color: var(--ink-2); }
.next-row { display: flex; justify-content: flex-end; padding-top: 0.5rem; }

/* results */
.result { display: grid; gap: 2.25rem; }
.r-hero { display: grid; gap: 0.75rem; }
.r-hero .tag { font-size: 1.2rem; color: var(--ink-2); max-width: 36rem; }
.section { display: grid; gap: 0.9rem; }
.section > h2 { font-size: var(--s-2); }
.traits { display: grid; gap: 1.05rem; }
.trait { display: grid; grid-template-columns: 11rem 1fr 2.6rem; gap: 0.35rem 0.9rem; align-items: center; }
.t-name { font-family: var(--f-mono); font-size: 0.78rem; letter-spacing: 0.04em; }
.t-bar { height: 0.6rem; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.t-bar span { display: block; height: 100%; background: var(--ink); border-radius: 99px; transform-origin: left; animation: grow 900ms cubic-bezier(.2, .7, .2, 1) both; }
.trait.top .t-bar span { background: var(--red); }
.trait.top .t-name { color: var(--red); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.t-val { font-family: var(--f-mono); font-size: 0.85rem; text-align: right; font-variant-numeric: tabular-nums; }
.t-desc { grid-column: 1 / -1; color: var(--ink-2); font-size: 0.92rem; }
.prose { display: grid; gap: 0.8rem; }
.prose p { max-width: 38rem; }
.facets { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 0.75rem; }
.facet { display: grid; gap: 0.35rem; align-content: start; padding: 1rem 1.1rem; background: var(--card); border: 1px solid var(--rule); border-radius: 6px; min-width: 0; }
.patterns { display: grid; gap: 1.25rem; }
.pattern { display: grid; gap: 0.35rem; padding-left: 1rem; border-left: 2px solid var(--red); }
.pattern h3 { font-size: 1.25rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
.meter { display: flex; gap: 0.35rem; }
.meter span { width: 1.6rem; height: 0.6rem; border-radius: 2px; background: var(--sunk); border: 1px solid var(--rule); }
.meter span.on { background: var(--ink); border-color: var(--ink); }
.blind, .notice { padding: 1.2rem 1.3rem; background: var(--red-wash); border-radius: 6px; display: grid; gap: 0.5rem; }
.mirror-pair { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 0.75rem; }
.recap { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.recap li { display: grid; grid-template-columns: 4.5rem 1fr; gap: 0.2rem 1rem; padding-block: 0.85rem; border-bottom: 1px solid var(--rule); }
.recap .num { font-family: var(--f-mono); font-size: 0.78rem; color: var(--red); padding-top: 0.25rem; }
.recap .body { display: grid; gap: 0.25rem; min-width: 0; }
.recap .t { font-family: var(--f-display); font-size: 1.1rem; }
.recap .ans { font-size: 0.96rem; }
.recap .pick { display: grid; gap: 0.15rem; padding-top: 0.45rem; }
.recap .note { font-size: 0.95rem; color: var(--ink-2); }
.recap .note b { font-weight: 500; color: var(--ink); }
.recap .lab { font-family: var(--f-mono); font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 0.4rem; color: var(--ink-2); }
.recap details.fold { margin-top: 0.6rem; }
.status { font-family: var(--f-mono); font-size: 0.75rem; color: var(--ink-2); }
.linkbox { width: 100%; padding: 0.6rem 0.7rem; font-family: var(--f-mono); font-size: 0.78rem; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 4px; }

.foot { border-top: 1px solid var(--rule); padding-block: 1.25rem 2rem; color: var(--ink-2); font-size: 0.9rem; display: grid; gap: 0.4rem; }

@media (max-width: 560px) {
  .trait { grid-template-columns: 1fr 2.6rem; }
  .t-bar { grid-column: 1 / -1; grid-row: 2; }
  .plate-list li, .recap li { grid-template-columns: 1fr; }
  .plate-list .th { grid-column: 1; }
  .msg, .msg.you, .choices { max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .blot, .reveal, .t-bar span, .typing span { animation: none; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="wordmark">The Quiet <i>Questions</i></span>
    <nav class="progress" id="progress" aria-label="Progress" hidden></nav>
  </header>
  <main id="app">
    <noscript><p>This page needs JavaScript to run the session.</p></noscript>
  </main>
  <footer class="foot">
    <p>Built on published research in moral psychology and behavioural economics. Sources are listed after every plate.</p>
    <p>A reflective exercise, not a clinical or validated psychological test. A few answers cannot capture a whole person.</p>
  </footer>
</div>
<script>
(() => {
"use strict";

// Paste your Google Apps Script web-app URL here to record every finished session in your Google Sheet (see README).
const RESPONSE_ENDPOINT = "https://script.google.com/macros/s/AKfycbwwNbFaTHrr2eo9gdwAuldV_wZfwiOMOqU8Rg9hPcnO2Z1IFeBrbqQP4iyAioZzIFpglQ/exec";

/* ---------- traits ---------- */
const TRAITS = [
  { k: "C", name: "Compassion", desc: "How strongly other people's feelings and suffering steer your choices." },
  { k: "A", name: "Respect for autonomy", desc: "How far you let other adults run their own lives, even badly." },
  { k: "I", name: "Principle", desc: "How much fixed rules of honesty and fairness govern you, watched or not." },
  { k: "L", name: "Loyalty", desc: "How much duties to your own people outweigh duties to strangers and rules." },
  { k: "T", name: "Appetite for truth", desc: "How willing you are to seek, face and deliver uncomfortable facts." },
  { k: "P", name: "Self-protection", desc: "How carefully you guard your own resources, comfort and peace of mind." }
];
const TRAIT = Object.fromEntries(TRAITS.map(t => [t.k, t]));
const ORDER = "CAILTP";

/* ---------- the five plates ----------
   Each plate is a three-round session: the choice, the reason behind it (why), and a twist (follow).
   score: points added to each trait. held: true if the twist answer kept the first stance,
   false if it moved, null where the twist does not test a stance. */
const PLATES = [
{
  numeral: "I", seed: 1931, reds: 0,
  title: "The Beggar and the Bottle",
  theme: "Generosity and control",
  scenario: "A man outside a shop asks you for some money. His breath smells of alcohol, and you are fairly sure that whatever you give will go on another bottle, not a meal. You have spare change, and giving it would cost you nothing that matters.",
  prompt: "What do you do?",
  measures: "Whether your generosity is about him, the outcome, or your own comfort.",
  options: [
    { key: "A", text: "Give him the money. What he does with it is his business.", score: { A: 2, C: 1 },
      title: "Help without strings",
      body: "You keep helping and controlling separate. He is an adult, and how he gets through the night is his call, not yours.",
      daily: "You give advice only when asked and let people make their own mistakes.",
      case: "Respect for autonomy. A gift with conditions is control.",
      why: { prompt: "What's the main reason you'd give?",
        options: [
          { key: "a", text: "It's his life. I don't get to decide how he survives.", score: { A: 1 },
            title: "Autonomy as a value",
            body: "You give because his choices are his. You reject paternalism even when you expect a bad choice." },
          { key: "b", text: "Saying no to someone's face feels worse than the risk.", score: { C: 1, P: 1 },
            title: "Easing your own discomfort",
            body: "Part of the gift is for you: it ends an awkward moment. In Batson's experiments, people helping to relieve their own distress mostly left when leaving was easy." },
          { key: "c", text: "It costs me little, and it might get him through tonight.", score: { C: 2 },
            title: "Harm reduction",
            body: "You look at tonight's suffering, not his choices. Meet people where they are." }
        ] },
      follow: { prompt: "He thanks you, then asks for one more thing. The shop won't serve him. Would you go in and buy the bottle for him with that same money?",
        options: [
          { key: "A1", text: "Yes. Same money, same choice, his decision.", score: { A: 2, I: 1 }, held: true,
            title: "Consistent all the way",
            body: "You held your principle when it got uncomfortable; most cash-givers stop here. The catch: addiction erodes the very choice you are respecting." },
          { key: "A2", text: "No. Giving cash is fine, but buying the bottle myself feels wrong.", score: { C: 1, P: 1 }, held: false,
            title: "Comfortable at a distance",
            body: "Same outcome, but doing it with your own hands feels worse. We judge harm we cause more harshly than harm we enable." }
        ] } },
    { key: "B", text: "Buy him food instead. I'll help, but not with alcohol.", score: { C: 2, A: -1 },
      title: "Care with a steering wheel",
      body: "You want to help, on your terms. This is paternalistic altruism: in one experiment donors gave about 40% more when they could give in kind instead of cash.",
      daily: "You show love through practical help, and it stings when it's used differently.",
      case: "Responsible care. Help the person, not the addiction.",
      why: { prompt: "Why food and not money?",
        options: [
          { key: "a", text: "Money would make his drinking worse.", score: { C: 1, A: -1 },
            title: "Protective care",
            body: "You think cash would hurt him. Cash-transfer studies find this fear is usually overstated, though addiction is a harder case." },
          { key: "b", text: "I want to know my help is used properly.", score: { P: 1, A: -1 },
            title: "Accountability",
            body: "You need to know your gift did what you meant it to. Your giving is also a statement of your values." },
          { key: "c", text: "Food is what everyone needs. It's the safest kind of help.", score: { C: 1, I: 1 },
            title: "Help that can't go wrong",
            body: "You pick the safest help: no refusing, no enabling, no judging." }
        ] },
      follow: { prompt: "You hand him a sandwich. He says politely, \"Thanks, but I'm not hungry. I really just need the money.\" How do you feel?",
        options: [
          { key: "B1", text: "Fair enough. I'd give him a little cash too.", score: { A: 2, C: 1 }, held: false,
            title: "You listen and adjust",
            body: "You dropped your plan once he spoke for himself. Your help follows the person, not your picture of them." },
          { key: "B2", text: "A bit irritated. I offered help and he turned it down.", score: { A: -1, P: 1 }, held: true,
            title: "Help on your terms",
            body: "The irritation shows a hidden condition: take my help my way. Watch for it when people ignore your advice." },
          { key: "B3", text: "Calm. Food is what I'm willing to give, and that's that.", score: { I: 1, P: 1 }, held: true,
            title: "Firm, without resentment",
            body: "You keep your line and don't take his refusal personally. The healthiest form of conditional giving." }
        ] } },
    { key: "C", text: "Give nothing. I won't fund an addiction.", score: { P: 2, I: 1, C: -1 },
      title: "The gatekeeper",
      body: "You judge help by its outcome; if it feeds harm, you hold back. Most people make this call in a split second by asking one question: bad luck, or his own doing?",
      daily: "You hold people to clear standards and hate being taken advantage of.",
      case: "Responsible refusal. Money that feeds an addiction isn't kindness.",
      why: { prompt: "What's behind the no?",
        options: [
          { key: "a", text: "Money would only feed the addiction and hurt him more.", score: { C: 1, I: 1 },
            title: "Refusal as care",
            body: "Your no is meant to protect him. You care as much as a giver does; you just disagree on what helps." },
          { key: "b", text: "I shouldn't have to pay for someone else's choices.", score: { P: 2, C: -1 },
            title: "Personal responsibility",
            body: "His choices, his costs. Fair as a rule, harsh on people whose choices were shaped by things they never chose." },
          { key: "c", text: "I've been tricked before. I don't trust street requests.", score: { P: 2 },
            title: "Burned before",
            body: "Experience taught you suspicion. It protects you, and it treats the next real case like the last fake one." }
        ] },
      follow: { prompt: "Same man. This time you somehow know for certain the money will buy food for his child. Do you give?",
        options: [
          { key: "C1", text: "Yes, then I'd give.", score: { C: 2, I: 1 }, held: false,
            title: "Conditional compassion",
            body: "Your generosity is real but gated by who seems to deserve it. The people who look least deserving often need help most." },
          { key: "C2", text: "Still no. I don't give money to people on the street.", score: { P: 2 }, held: true,
            title: "Policy over impulse",
            body: "You run on a rule, not the story in front of you. Make sure it's a decision, not a way to avoid looking." }
        ] } },
    { key: "D", text: "Walk past without really deciding.", score: { P: 1, T: -1 },
      title: "The quiet swerve",
      body: "You avoided the choice instead of making it. In one field study, 26% to 33% of shoppers used another door to dodge a charity collector who asked directly.",

/* ---------- scoring ----------
   Works on finished and unfinished sessions alike: only the answers given are scored,
   against the range those same answers could have reached. */
function zero() { return Object.fromEntries(TRAITS.map(t => [t.k, 0])); }
function add(s, sc) { for (const k in sc) s[k] += sc[k]; }
function picks(a) {
  return PLATES.map((p, i) => {
    const q = "q" + (i + 1);
    const o = p.options.find(o => o.key === a[q]);
    const w = o && o.why.options.find(w => w.key === a[q + "w"]);
    const f = w && o.follow.options.find(f => f.key === a[q + "f"]);
    return { p, o, w, f };
  });
}
// RANGE[plate][depth - 1]: the lowest and highest total each trait can reach after 1, 2 or 3 answers on that plate.
const RANGE = PLATES.map(p => [1, 2, 3].map(depth => {
  const lo = zero(), hi = zero();
  TRAITS.forEach(({ k }) => {
    let mn = Infinity, mx = -Infinity;
    p.options.forEach(o => o.why.options.forEach(w => o.follow.options.forEach(f => {
      const v = (o.score[k] || 0) + (depth > 1 ? w.score[k] || 0 : 0) + (depth > 2 ? f.score[k] || 0 : 0);
      mn = Math.min(mn, v); mx = Math.max(mx, v);

    lo[k] = mn; hi[k] = mx;

}));
const TOTAL_ANSWERS = PLATES.length * 3 + MIRROR.length;
function pairKey(x, y) { return [x, y].sort((m, n) => ORDER.indexOf(m) - ORDER.indexOf(n)).join(""); }

  const raw = zero(), lo = zero(), hi = zero();
  let held = 0, counted = 0, answered = 0;
  picks(a).forEach(({ o, w, f }, i) => {
    const given = [o, w, f].filter(Boolean);
    if (!given.length) return;
    answered += given.length;
    given.forEach(x => add(raw, x.score));
    const r = RANGE[i][given.length - 1];
    TRAITS.forEach(({ k }) => { lo[k] += r.lo[k]; hi[k] += r.hi[k]; });
    if (f && f.held !== null) { counted++; if (f.held) held++; }
  });
  answered += (a.m1 ? 1 : 0) + (a.m2 ? 1 : 0);
  // null: none of the answers so far can move this trait, so there is nothing to score yet.
  const pct = {};
  TRAITS.forEach(({ k }) => {
    const span = hi[k] - lo[k];
    pct[k] = span ? Math.round((raw[k] - lo[k]) / span * 100) : null;
  });
  const order = TRAITS.map(t => t.k).filter(k => pct[k] !== null)
    .sort((x, y) => (pct[y] - pct[x]) || (raw[y] - raw[x]) || (ORDER.indexOf(x) - ORDER.indexOf(y)));
  const top = order[0], second = order[1], low = order[order.length - 1];
  const patterns = PATTERNS.filter(r => r.when(a)).slice(0, 5);
  return { raw, pct, order, top, second, low, pair: second ? PAIRS[pairKey(top, second)] : null, patterns, held, counted,

// The first question still unanswered, or null when the session is complete.
function nextQuestion(a) {

    if (!a[q + "w"]) return n + " reason";
    if (!a[q + "f"]) return n + " twist";
  }
  if (!a.m1) return "mirror question 1";
  if (!a.m2) return "mirror question 2";

}

/* ---------- answer codes and links ----------
   Each plate is coded as choice letter + reason letter + twist digit, e.g. "Ab1".
   Unfinished sessions stop part-way: "Ab" or "A" for the plate in progress, "-" for plates not reached. */
function codeOf(a) {
  return PLATES.map((_, i) => {
    const q = "q" + (i + 1);
    return a[q] ? a[q] + (a[q + "w"] || "") + (a[q + "f"] ? a[q + "f"].slice(1) : "") : "-";
  }).join(".");
}
function answersFromCode(code, mirror) {
  const parts = String(code || "").split(".");

  const a = {};
  let open = true; // answers come in order, so nothing may follow an unfinished plate
  for (let i = 0; i < PLATES.length; i++) {
    const s = parts[i];
    if (s === "-") { open = false; continue; }
    const m = /^([A-D])([a-c])?([1-3])?$/.exec(s);
    if (!open || !m || (m[3] && !m[2])) return null;
    const o = PLATES[i].options.find(o => o.key === m[1]);
    if (!o || (m[2] && !o.why.options.some(w => w.key === m[2])) || (m[3] && !o.follow.options.some(f => f.key === m[1] + m[3]))) return null;
    const q = "q" + (i + 1);

}
function resultLink(a, name) { return location.href.split("#")[0] + hashOf(a, name); }

/* ---------- state ---------- */
let state = { name: "", answers: {}, session: "" };

function newSession() {
  const b = new Uint8Array(6);
  crypto.getRandomValues(b);
  return Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
}
// Version 2 of the recorder updates one row per session, which lets the page save after every answer.
// Against version 1 the page only saves once, at the end, so it never fills the sheet with partial copies.
let recorder = null;
function recorderVersion() {
  if (!recorder) recorder = fetch(RESPONSE_ENDPOINT, { cache: "no-store" }).then(r => r.json()).then(j => j.version || 1, () => 1);
  return recorder;
}
// Called after every answer, so a session that is abandoned or times out still reaches the sheet.
function saveProgress() {
  if (!RESPONSE_ENDPOINT) return;
  const a = Object.assign({}, state.answers), name = state.name, session = state.session;
  recorderVersion().then(v => { if (v >= 2) saveResponse(a, name, session); });
}

// SHA-256 of the owner's passphrase. A reading opens only in a browser where that passphrase has been entered;
// people taking the questionnaire never see one.
const OWNER_HASH = "45b6392af63d8ef490e8c33ba84795c9940e67bfec697c4e4b3ff248921234f5";
const OWNER_KEY = "qq-owner";

async function sha256(s) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, "0")).join("");
}
function storedPass() { try { return localStorage.getItem(OWNER_KEY) || ""; } catch (e) { return ""; } }
async function isOwner(pass) {
  if (!pass || !window.crypto || !crypto.subtle) return false;
  return (await sha256(pass)) === OWNER_HASH;
}

function setProgress(current) {
  if (current < 0) { $progress.hidden = true; return; }
  $progress.hidden = false;
  $progress.textContent = "";
  const stops = PLATES.map(p => ({ label: p.numeral, title: "Plate " + p.numeral })).concat([{ label: "M", title: "Two last questions" }]);
  stops.forEach((s, i) => {
    const cls = "dot" + (i < current ? " done" : i === current ? " now" : "");
    $progress.append(el("span", { class: cls, title: s.title, "aria-current": i === current ? "step" : null }, s.label));
  });
}

/* ---------- the session thread ---------- */
async function analystSays(thread, kids, delay, anchor) {
  const typing = el("div", { class: "msg typing", "aria-hidden": "true" }, [el("span"), el("span"), el("span")]);
  thread.append(typing);
  bringIntoView(typing, anchor);
  await wait(delay);
  typing.remove();
  const msg = el("div", { class: "msg reveal" }, [el("span", { class: "who" }, "Analyst")].concat(kids));
  thread.append(msg);
  bringIntoView(msg, anchor || msg);
  return msg;
}
function choose(thread, options, anchor) {
  return new Promise(resolve => {
    const box = el("div", { class: "choices reveal", role: "group", "aria-label": "Your answer" });
    options.forEach((o, n) => {
      const b = el("button", { class: "choice", type: "button" }, [el("span", { class: "k" }, String.fromCharCode(65 + n)), el("span", null, o.text)]);
      b.addEventListener("click", () => {
        box.remove();
        const mine = el("div", { class: "msg you reveal" }, [el("span", { class: "who" }, state.name), el("p", null, o.text)]);
        thread.append(mine);
        resolve({ o, mine });
      }, { once: true });
      box.append(b);
    });
    thread.append(box);
    bringIntoView(box, anchor);
  });
}
// One round: the analyst asks and the person picks. The person answering never sees what an answer reads as.
async function round(thread, prompt, options, anchor, delay) {
  const ask = await analystSays(thread, [el("p", { class: "ask" }, prompt)], delay, anchor);
  return choose(thread, options, ask);
}
function nextBlock(label, onClick) {
  const b = el("button", { class: "btn", type: "button" }, label);
  b.addEventListener("click", onClick, { once: true });
  return el("div", { class: "after reveal" }, el("div", { class: "next-row" }, b));
}

/* ---------- plate ---------- */
function renderPlate(i) {
  setProgress(i);
  const p = PLATES[i], q = "q" + (i + 1);
  const m = clear();
  const s = el("section", { class: "plate" });
  const h = el("h2", { tabindex: "-1" }, p.title);
  const scenario = el("p", { class: "scenario" }, p.scenario);
  const thread = el("div", { class: "thread", "aria-live": "polite" });
  s.append(el("p", { class: "eyebrow" }, "Plate " + p.numeral + " of V · " + p.theme), h, blot(p.seed, p.reds), scenario, thread);
  m.append(s);
  window.scrollTo({ top: 0, behavior: "auto" });
  h.focus({ preventScroll: true });

  (async () => {
    const r1 = await round(thread, p.prompt, p.options, scenario, 500);
    const o = r1.o;
    state.answers[q] = o.key;
    saveProgress();
    const r2 = await round(thread, o.why.prompt, o.why.options, r1.mine, 700);
    state.answers[q + "w"] = r2.o.key;
    saveProgress();
    const r3 = await round(thread, o.follow.prompt, o.follow.options, r2.mine, 700);
    state.answers[q + "f"] = r3.o.key;
    saveProgress();
    const last = i === PLATES.length - 1;
    const after = nextBlock(last ? "Two last questions" : "Next: plate " + PLATES[i + 1].numeral, () => last ? renderMirror() : renderPlate(i + 1));
    s.append(after);
    bringIntoView(after, r3.mine);
  })();
}

function researchFold(label, items) {

  const list = el("ul", { class: "refs" });
  items.forEach(r => list.append(el("li", null, [

    el("p", { class: "cite" }, el("a", { href: r.url, target: "_blank", rel: "noopener" }, r.cite))
  ])));
  fold.append(el("div", { class: "fold-body" }, list));
  return fold;
}

/* ---------- the mirror ---------- */
function renderMirror() {
  setProgress(PLATES.length);
  const m = clear();
  const s = el("section", { class: "plate" });
  const h = el("h2", { tabindex: "-1" }, "The mirror");
  const intro = el("p", { class: "scenario" }, "You have answered five dilemmas about other people. Before you finish, the analyst turns the questions around.");
  const thread = el("div", { class: "thread", "aria-live": "polite" });
  s.append(el("p", { class: "eyebrow" }, "Closing round · How you see yourself"), h, intro, thread);
  m.append(s);
  window.scrollTo({ top: 0, behavior: "auto" });
  h.focus({ preventScroll: true });

  (async () => {
    const r1 = await round(thread, MIRROR[0].prompt, MIRROR[0].options, intro, 500);
    state.answers.m1 = r1.o.key;
    saveProgress();
    const r2 = await round(thread, MIRROR[1].prompt, MIRROR[1].options, r1.mine, 700);

/* ---------- end of the session ---------- */
function finish() {
  const a = state.answers, name = state.name, session = state.session;
  setProgress(PLATES.length + 1);
  const m = clear();
  const status = el("p", { class: "status", role: "status" });
  const retry = el("button", { class: "btn ghost", type: "button", hidden: true }, "Try sending again");
  m.append(el("section", { class: "intro" }, [
    blot(404, 2, "A symmetrical inkblot in black and red"),
    el("p", { class: "eyebrow" }, "Session complete"),
    el("h1", null, "Thank you, " + name + "."),
    el("p", { class: "lede" }, "That's everything. Your answers go only to the person who shared this page with you. You can close this tab."),
    el("div", { class: "row" }, [retry, status])
  ]));
  window.scrollTo({ top: 0, behavior: "auto" });
  if (!RESPONSE_ENDPOINT) { status.textContent = "Recording is not set up, so these answers were not saved."; return; }
  const send = () => {
    retry.hidden = true;
    status.textContent = "Sending your answers…";
    saveResponse(a, name, session).then(ok => {
      status.textContent = ok ? "Your answers were sent." : "Your answers could not be sent. Check your connection and try again.";
      retry.hidden = ok;
    });
  };
  retry.addEventListener("click", send);
  send();
}

    body: TRAIT[pr.top].name + " pulled hardest and " + TRAIT[pr.low].name.toLowerCase() + " least. When they conflict, expect the first to decide."
  }];
  r.append(el("div", { class: "section" }, [
    el("h2", null, "Patterns across the answers"),
    el("div", { class: "patterns" }, pats.map(p => el("div", { class: "pattern" }, [el("h3", null, p.title), el("p", null, p.body)])))
  ]));

  const ratio = pr.counted ? pr.held / pr.counted : 0.5;
  const flex = ratio >= 0.7
    ? ["Steady", "You kept your first answer in most twists. Predictable and principled; when the facts really change, it can look like stubbornness."]
    : ratio <= 0.35
      ? ["Responsive", "Your answers moved when the facts moved. Good judgement in messy cases, but harder for others to predict."]
      : ["Selective", "You held some positions and let others move. You know which commitments are fixed and which depend on details."];
  const meter = el("div", { class: "meter", role: "img", "aria-label": pr.held + " of " + pr.counted + " positions held" });
  for (let k = 0; k < pr.counted; k++) meter.append(el("span", { class: k < pr.held ? "on" : "" }));
  if (pr.counted) r.append(el("div", { class: "section" }, [
    el("h2", null, "How a position is held"),
    el("div", { class: "row" }, [meter, el("span", { class: "status" }, pr.held + " of " + pr.counted + " held under pressure · " + flex[0])]),
    el("p", { class: "prose" }, flex[1])
  ]));

  r.append(el("div", { class: "blind" }, [
    el("p", { class: "eyebrow" }, "Blind spot"),
    el("h3", null, TRAIT[pr.low].name),
    el("p", null, PROFILES[pr.low].low)
  ]));

  if (a.m1) {
    const m1 = MIRROR[0].options.find(o => o.key === a.m1), m2 = a.m2 && MIRROR[1].options.find(o => o.key === a.m2);
    r.append(el("div", { class: "section" }, [
      el("h2", null, "Self-view"),
      m2 ? el("p", { class: "prose" }, mirrorSummary(a.m1, a.m2)) : null,
      el("div", { class: "mirror-pair" }, [
        el("div", { class: "facet" }, [el("span", { class: "label" }, "Compared with others: " + m1.text.replace(/\.$/, "").toLowerCase()), el("h3", null, m1.title), el("p", null, m1.body)]),
        m2 ? el("div", { class: "facet" }, [el("span", { class: "label" }, "Answered: " + m2.text.replace(/\.$/, "").toLowerCase()), el("h3", null, m2.title), el("p", null, m2.body)]) : null
      ]),
      researchFold("Research", MIRROR_RESEARCH)
    ]));
  }

  // Every answer with the analyst's remark on it; the person answering never saw these.
  const pick = (label, x, daily) => el("div", { class: "pick" }, [
    el("p", { class: "ans" }, [el("span", { class: "lab" }, label), x.text]),
    el("p", { class: "note" }, [el("b", null, x.title + ". "), x.body]),
    daily ? el("p", { class: "note" }, [el("span", { class: "lab" }, "In daily life"), daily]) : null
  ]);
  const recap = el("ol", { class: "recap" });
  picks(a).forEach(({ p, o, w, f }) => recap.append(el("li", null, [
    el("span", { class: "num" }, "Plate " + p.numeral),
    el("div", { class: "body" }, [
      el("span", { class: "t" }, p.title),
      el("p", { class: "hint" }, p.measures),
      o ? pick("Chose", o, o.daily) : el("p", { class: "note" }, "Not reached."),
      w ? pick("Because", w) : null,
      f ? pick("Then", f) : null,
      o && !f ? el("p", { class: "note" }, "The session stopped here.") : null,
      researchFold("Research", p.research)
    ])
  ])));
  r.append(el("div", { class: "section" }, [el("h2", null, "Answer by answer"), recap]));

  const refs = el("ul", { class: "refs" });
  FRAMEWORKS.forEach(x => refs.append(el("li", null, [el("p", null, x.use), el("p", { class: "cite" }, el("a", { href: x.url, target: "_blank", rel: "noopener" }, x.cite))])));
  r.append(el("details", { class: "fold" }, [el("summary", null, "Frameworks behind this reading"), el("div", { class: "fold-body" }, refs)]));

  const link = resultLink(a, name);
  const linkBox = el("input", { class: "linkbox", id: "result-link", type: "text", readonly: true, value: link, hidden: true, "aria-label": "Link to this reading" });
  const status = el("span", { class: "status", role: "status" });
  const copy = el("button", { class: "btn", type: "button" }, "Copy link to this reading");
  copy.addEventListener("click", () => {
    const done = () => { status.textContent = "Link copied."; };
    const fallback = () => { linkBox.hidden = false; linkBox.focus(); linkBox.select(); status.textContent = "Select and copy the link below."; };
    try { navigator.clipboard.writeText(link).then(done, fallback); } catch (e) { fallback(); }
  });
  const lock = el("button", { class: "btn ghost", type: "button" }, "Lock this browser");
  lock.addEventListener("click", () => {
    try { localStorage.removeItem(OWNER_KEY); } catch (e) { /* ignore */ }
    try { history.replaceState(null, "", location.pathname + location.search); } catch (e) { /* ignore */ }
    state = { name: "", answers: {} };
    renderIntro();
    window.scrollTo({ top: 0 });
  });
  r.append(el("div", { class: "section" }, [
    el("p", { class: "hint" }, "Readings open only in a browser where your passphrase has been entered."),
    el("div", { class: "row" }, [copy, lock, status]),
    linkBox
  ]));

  m.append(r);
  window.scrollTo({ top: 0, behavior: "auto" });
}

// One row per session. New columns go at the end so rows saved earlier stay aligned with the headings.
function saveResponse(a, name, session) {
  const pr = profileOf(a), next = nextQuestion(a);
  const columns = ["Name", "Profile", "Strongest traits"];
  const values = [name, pr.pair ? pr.pair.name : "", pr.second ? TRAIT[pr.top].name + " + " + TRAIT[pr.second].name : ""];
  picks(a).forEach(({ p, o, w, f }) => {
    columns.push("Plate " + p.numeral + " choice", "Plate " + p.numeral + " reason", "Plate " + p.numeral + " twist");
    values.push(o ? o.key + ": " + o.text : "", w ? w.text : "", f ? f.key + ": " + f.text : "");
  });
  const m1 = MIRROR[0].options.find(o => o.key === a.m1), m2 = MIRROR[1].options.find(o => o.key === a.m2);
  columns.push("Compared with others", "Answered as");
  values.push(m1 ? m1.text : "", m2 ? m2.text : "");
  TRAITS.forEach(t => { columns.push(t.name); values.push(pr.pct[t.k] === null ? "" : pr.pct[t.k]); });
  columns.push("Patterns", "Positions held", "Answer code", "Reading link", "Status", "Answers given", "Session");
  values.push(pr.patterns.map(x => x.title).join("; "), pr.held + " of " + pr.counted, codeOf(a) + (a.m1 ? " / " + (a.m1 + (a.m2 || "")) : ""), resultLink(a, name),
    next ? "Incomplete (stopped before " + next + ")" : "Complete", pr.answered, session);
  return fetch(RESPONSE_ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    keepalive: true, // lets the save finish even if the person closes the tab straight after answering
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ session, step: pr.answered, columns, values })
  }).then(() => true, () => false);
}

/* ---------- routing ---------- */
function readHash() {
  const params = new URLSearchParams(location.hash.slice(1));
  return { a: answersFromCode(params.get("r"), params.get("m")), name: (params.get("n") || "someone").slice(0, 60) };
}
async function route() {
  const { a, name } = readHash();
  if (!a) { renderIntro(); return; }
  if (await isOwner(storedPass())) renderResults(a, name); else renderLock(a, name);
}
window.addEventListener("hashchange", () => { if (readHash().a) route(); });
route();
})();
</script>
